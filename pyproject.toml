[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coderus"
version = "0.1.0"
description = "A human-governed Codex development team for public repository issues"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "cryptography>=49,<50",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "lark-oapi>=1.7,<2",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "pwdlib[argon2]>=0.2,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[project.scripts]
coderus = "coderus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["coderus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
